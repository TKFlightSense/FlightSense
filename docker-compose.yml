version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: flightsense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flightsense}
      MYSQL_USER: ${MYSQL_USER:-flightsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootroot}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/docker/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - flightsense-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FlightSense Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightsense-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database Configuration
      USE_MYSQL: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flightsense}
      MYSQL_USER: ${MYSQL_USER:-flightsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flightsense123}
      
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VLLM_API_BASE: ${VLLM_API_BASE:-http://localhost:8001}
      
      # Jira Configuration
      USE_REAL_JIRA: ${USE_REAL_JIRA:-false}
      JIRA_URL: ${JIRA_URL}
      JIRA_USER: ${JIRA_USER}
      JIRA_TOKEN: ${JIRA_TOKEN}
      
      # API Security
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    networks:
      - flightsense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Review Entry UI
  review-entry:
    build:
      context: ./services/review_entry
      dockerfile: Dockerfile
    container_name: flightsense-review-entry
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flightsense}
      MYSQL_USER: ${MYSQL_USER:-flightsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flightsense123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flightsense-network

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightsense-worker
    restart: unless-stopped
    command: python services/automation/background_worker.py
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      # Database Configuration
      USE_MYSQL: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flightsense}
      MYSQL_USER: ${MYSQL_USER:-flightsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flightsense123}
      
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VLLM_API_BASE: ${VLLM_API_BASE:-http://localhost:8001}
      
      # Jira Configuration
      USE_REAL_JIRA: ${USE_REAL_JIRA:-false}
      JIRA_URL: ${JIRA_URL}
      JIRA_USER: ${JIRA_USER}
      JIRA_TOKEN: ${JIRA_TOKEN}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      
      # API Security
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    networks:
      - flightsense-network

  # Frontend UI
  frontend:
    build:
      context: ./frontend-ui
      dockerfile: Dockerfile
    container_name: flightsense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - flightsense-network

volumes:
  mysql_data:
    driver: local

networks:
  flightsense-network:
    driver: bridge
