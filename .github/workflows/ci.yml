name: ci
on: [push, pull_request]
jobs:
  py:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "3.11"}
    - run: pip install -U pip
    - run: pip install black ruff mypy pytest httpx fastapi uvicorn pydantic
    - run: black --check .
    - run: ruff .
    - run: mypy packages services || true
    - run: pytest -q || true
